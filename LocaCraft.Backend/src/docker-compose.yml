version: '3.9'

services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: postresuser
            POSTGRES_PASSWORD: postgrepassword
            POSTGRES_DB: locacraft
        ports:
            - "5432:5432"
        volumes:
            - locacraft-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postresuser locacraft"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
  locacraft-postgres-data: